[workspace]
members = [".", "apps/gtk", "crates/multiagent_core"]
resolver = "3"

[workspace.package]
version = "0.1.3"
license = "MIT"
homepage = "https://multiagent.dev"

[package]
name = "multiagent"
version.workspace = true
description = "Linux-first multi-agent coding workspace with chat, diffs, Git, and local runtime sessions."
edition = "2024"
rust-version = "1.92"
license.workspace = true
homepage.workspace = true

[dependencies]
multiagent_core = { path = "crates/multiagent_core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
diffy = "0.4"
libc = "0.2"
toml = "0.9"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
